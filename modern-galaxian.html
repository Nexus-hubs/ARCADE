<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Galaxian Ultra - Modern Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0015 0%, #1a0033 50%, #2d004d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        #gameContainer {
            position: relative;
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 0 80px rgba(138, 43, 226, 0.6),
                        0 0 120px rgba(75, 0, 130, 0.4),
                        inset 0 0 60px rgba(138, 43, 226, 0.1);
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid rgba(186, 85, 211, 0.5);
        }

        #gameCanvas {
            display: block;
            background: radial-gradient(ellipse at center, #0d0020 0%, #000000 100%);
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(180deg, rgba(10, 0, 30, 0.9) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.8),
                         0 0 20px rgba(138, 43, 226, 0.5);
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #ba55d3;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-value {
            font-size: 24px;
            color: #fff;
        }

        #lives {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        .life-icon {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #00ffff 0%, #0080ff 100%);
            clip-path: polygon(50% 0%, 100% 100%, 50% 80%, 0% 100%);
            filter: drop-shadow(0 0 5px #00ffff);
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        h1 {
            font-size: 64px;
            background: linear-gradient(45deg, #00ffff, #ba55d3, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(138, 43, 226, 0.6);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px rgba(138, 43, 226, 0.6)); }
            to { filter: drop-shadow(0 0 30px rgba(138, 43, 226, 1)); }
        }

        .subtitle {
            font-size: 18px;
            color: #ba55d3;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        button {
            padding: 15px 50px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #ba55d3 0%, #8a2be2 100%);
            border: 2px solid #fff;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6),
                        0 0 40px rgba(138, 43, 226, 0.4);
            pointer-events: all;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.8),
                        0 0 60px rgba(138, 43, 226, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        .controls {
            margin-top: 40px;
            text-align: center;
            color: #ba55d3;
            font-size: 14px;
        }

        .controls p {
            margin: 5px 0;
        }

        #powerupIndicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: rgba(138, 43, 226, 0.3);
            border: 2px solid #ba55d3;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #powerupIndicator.active {
            opacity: 1;
        }

        #mobileControls {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            padding: 20px;
            justify-content: space-between;
            pointer-events: none;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(138, 43, 226, 0.3);
            border: 3px solid rgba(186, 85, 211, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #fff;
            pointer-events: all;
            user-select: none;
            backdrop-filter: blur(10px);
            touch-action: none;
        }

        .control-btn:active {
            background: rgba(138, 43, 226, 0.6);
            transform: scale(0.95);
        }

        .control-group {
            display: flex;
            gap: 15px;
        }

        @media (max-width: 768px) {
            #mobileControls {
                display: flex;
            }

            h1 {
                font-size: 42px;
            }

            .subtitle {
                font-size: 14px;
            }

            #ui {
                font-size: 14px;
                padding: 15px;
            }

            .stat-value {
                font-size: 18px;
            }
        }

        .boss-warning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
            animation: pulse 0.5s ease-in-out;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="ui">
            <div class="stat">
                <span class="stat-label">Score</span>
                <span class="stat-value" id="score">0</span>
                <div id="lives"></div>
            </div>
            <div class="stat">
                <span class="stat-label">Wave</span>
                <span class="stat-value" id="wave">1</span>
            </div>
            <div class="stat">
                <span class="stat-label">High Score</span>
                <span class="stat-value" id="highScore">0</span>
            </div>
        </div>

        <div id="powerupIndicator"></div>

        <div id="mobileControls">
            <div class="control-group">
                <div class="control-btn" id="leftBtn">◄</div>
                <div class="control-btn" id="rightBtn">►</div>
            </div>
            <div class="control-btn" id="fireBtn">🎯</div>
        </div>

        <div id="startScreen">
            <h1>GALAXIAN ULTRA</h1>
            <div class="subtitle">Modern Edition</div>
            <button id="startBtn">Start Game</button>
            <div class="controls">
                <p>Desktop: Arrow Keys to Move, Space to Fire</p>
                <p>Mobile: Touch Controls</p>
                <p>💫 Collect power-ups for special abilities!</p>
            </div>
        </div>

        <div id="gameOverScreen" style="display: none;">
            <h1>GAME OVER</h1>
            <div class="subtitle" id="finalScore"></div>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        // Game Configuration
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive canvas sizing
        function resizeCanvas() {
            const maxWidth = window.innerWidth > 800 ? 800 : window.innerWidth - 20;
            const maxHeight = window.innerHeight - 20;
            const aspectRatio = 3 / 4;

            if (maxWidth / maxHeight > aspectRatio) {
                canvas.height = maxHeight;
                canvas.width = maxHeight * aspectRatio;
            } else {
                canvas.width = maxWidth;
                canvas.height = maxWidth / aspectRatio;
            }
        }

        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (game.state === 'playing') {
                player.x = canvas.width / 2;
            }
        });

        // Audio System
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        const sounds = {
            shoot: (frequency = 440) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = frequency;
                osc.type = 'square';
                gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                osc.start();
                osc.stop(audioContext.currentTime + 0.1);
            },

            explosion: () => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                const filter = audioContext.createBiquadFilter();

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioContext.destination);

                osc.type = 'sawtooth';
                filter.type = 'lowpass';
                filter.frequency.value = 1000;

                osc.frequency.setValueAtTime(200, audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioContext.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

                osc.start();
                osc.stop(audioContext.currentTime + 0.3);
            },

            powerup: () => {
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = freq;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                        osc.start();
                        osc.stop(audioContext.currentTime + 0.2);
                    }, i * 50);
                });
            },

            enemyDive: () => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.setValueAtTime(800, audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.3);
                osc.type = 'triangle';
                gain.gain.setValueAtTime(0.08, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                osc.start();
                osc.stop(audioContext.currentTime + 0.3);
            },

            boss: () => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 100;
                osc.type = 'sawtooth';
                gain.gain.setValueAtTime(0.15, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc.start();
                osc.stop(audioContext.currentTime + 0.5);
            }
        };

        // Game State
        const game = {
            state: 'start',
            score: 0,
            wave: 1,
            highScore: parseInt(localStorage.getItem('galaxianHighScore')) || 0,
            frameCount: 0,
            particles: [],
            powerups: [],
            showBossWarning: false
        };

        // Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            width: 40,
            height: 40,
            speed: 5,
            lives: 3,
            bullets: [],
            canShoot: true,
            shootCooldown: 0,
            invulnerable: 0,
            powerup: null,
            powerupTime: 0,
            rapidFire: false,
            shield: false,
            spreadShot: false
        };

        // Enemies
        const enemies = [];
        const enemyBullets = [];

        class Enemy {
            constructor(x, y, type = 'basic') {
                this.x = x;
                this.y = y;
                this.width = 35;
                this.height = 35;
                this.type = type;
                this.speed = 1;
                this.diving = false;
                this.diveSpeed = 3;
                this.diveAngle = 0;
                this.shootTimer = Math.random() * 200;
                this.animFrame = 0;

                // Type-specific properties
                switch(type) {
                    case 'elite':
                        this.color1 = '#ff00ff';
                        this.color2 = '#ff69b4';
                        this.points = 100;
                        this.health = 2;
                        break;
                    case 'fast':
                        this.color1 = '#00ffff';
                        this.color2 = '#00ff88';
                        this.points = 80;
                        this.speed = 2;
                        this.health = 1;
                        break;
                    case 'boss':
                        this.width = 80;
                        this.height = 80;
                        this.color1 = '#ff0000';
                        this.color2 = '#ff8800';
                        this.points = 1000;
                        this.health = 20;
                        this.speed = 0.5;
                        break;
                    default:
                        this.color1 = '#8a2be2';
                        this.color2 = '#ba55d3';
                        this.points = 50;
                        this.health = 1;
                }
            }

            update() {
                this.animFrame++;

                if (this.diving) {
                    this.x += Math.sin(this.diveAngle) * this.diveSpeed;
                    this.y += this.diveSpeed;
                    this.diveAngle += 0.1;

                    if (this.y > canvas.height || this.x < 0 || this.x > canvas.width) {
                        this.diving = false;
                        this.y = 50;
                        this.x = Math.random() * (canvas.width - this.width);
                    }
                } else {
                    this.x += Math.sin(game.frameCount * 0.02 + this.y) * this.speed;

                    // Random dive attack
                    if (Math.random() < 0.002 && this.type !== 'boss') {
                        this.diving = true;
                        this.diveAngle = Math.atan2(player.y - this.y, player.x - this.x);
                        sounds.enemyDive();
                    }
                }

                // Shooting
                this.shootTimer--;
                if (this.shootTimer <= 0 && !this.diving) {
                    this.shoot();
                    this.shootTimer = this.type === 'boss' ? 30 : 200 + Math.random() * 100;
                }
            }

            shoot() {
                enemyBullets.push({
                    x: this.x + this.width / 2,
                    y: this.y + this.height,
                    speed: this.type === 'boss' ? 5 : 3,
                    width: 4,
                    height: 12
                });
                sounds.shoot(220);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                // Pulsing glow effect
                const pulse = Math.sin(this.animFrame * 0.1) * 0.3 + 0.7;
                ctx.shadowBlur = 20 * pulse;
                ctx.shadowColor = this.color1;

                if (this.type === 'boss') {
                    // Boss design
                    ctx.fillStyle = this.color1;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = this.color2;
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2 + this.animFrame * 0.05;
                        const x = Math.cos(angle) * (this.width / 3);
                        const y = Math.sin(angle) * (this.width / 3);
                        ctx.beginPath();
                        ctx.arc(x, y, 8, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Health bar
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                    ctx.fillRect(-this.width / 2, this.height / 2 + 10, this.width, 5);
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(-this.width / 2, this.height / 2 + 10, this.width * (this.health / 20), 5);
                } else {
                    // Regular enemy design
                    const gradient = ctx.createLinearGradient(-this.width / 2, -this.height / 2, this.width / 2, this.height / 2);
                    gradient.addColorStop(0, this.color1);
                    gradient.addColorStop(1, this.color2);
                    ctx.fillStyle = gradient;

                    // Main body
                    ctx.beginPath();
                    ctx.moveTo(0, -this.height / 2);
                    ctx.lineTo(this.width / 3, this.height / 2);
                    ctx.lineTo(-this.width / 3, this.height / 2);
                    ctx.closePath();
                    ctx.fill();

                    // Wings
                    ctx.fillStyle = this.color2;
                    ctx.fillRect(-this.width / 2, 0, this.width / 4, this.height / 3);
                    ctx.fillRect(this.width / 4, 0, this.width / 4, this.height / 3);

                    // Cockpit
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, -this.height / 4, 5, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            hit() {
                this.health--;
                if (this.health <= 0) {
                    createExplosion(this.x + this.width / 2, this.y + this.height / 2, this.type === 'boss' ? 50 : 20);
                    sounds.explosion();
                    game.score += this.points;

                    // Chance to drop powerup
                    if (Math.random() < (this.type === 'boss' ? 0.8 : 0.15)) {
                        spawnPowerup(this.x + this.width / 2, this.y + this.height / 2);
                    }

                    return true;
                }
                return false;
            }
        }

        // Powerup system
        function spawnPowerup(x, y) {
            const types = ['rapidFire', 'shield', 'spreadShot'];
            const type = types[Math.floor(Math.random() * types.length)];
            game.powerups.push({
                x: x,
                y: y,
                type: type,
                speed: 2,
                size: 20,
                rotation: 0
            });
        }

        // Particle system
        function createExplosion(x, y, count = 20) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                const speed = 2 + Math.random() * 3;
                game.particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    size: 3 + Math.random() * 3,
                    color: `hsl(${Math.random() * 60 + 280}, 100%, 50%)`
                });
            }
        }

        // Initialize enemies
        function spawnWave() {
            enemies.length = 0;
            enemyBullets.length = 0;

            // Boss wave every 5 waves
            if (game.wave % 5 === 0) {
                showBossWarning();
                setTimeout(() => {
                    enemies.push(new Enemy(canvas.width / 2 - 40, 100, 'boss'));
                    sounds.boss();
                }, 2000);
            } else {
                const rows = Math.min(3 + Math.floor(game.wave / 2), 6);
                const cols = 8;
                const spacing = canvas.width / (cols + 1);

                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        let type = 'basic';
                        if (game.wave > 2 && Math.random() < 0.2) type = 'elite';
                        if (game.wave > 4 && Math.random() < 0.15) type = 'fast';

                        enemies.push(new Enemy(
                            spacing * (col + 1) - 17.5,
                            50 + row * 50,
                            type
                        ));
                    }
                }
            }
        }

        function showBossWarning() {
            const warning = document.createElement('div');
            warning.className = 'boss-warning';
            warning.textContent = '⚠️ BOSS APPROACHING ⚠️';
            document.getElementById('gameContainer').appendChild(warning);
            setTimeout(() => warning.remove(), 2000);
        }

        // Input handling
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === ' ' && game.state === 'playing') {
                e.preventDefault();
                shoot();
            }
        });
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Mobile controls
        const mobileButtons = {
            left: false,
            right: false,
            fire: false
        };

        ['leftBtn', 'rightBtn', 'fireBtn'].forEach(id => {
            const btn = document.getElementById(id);

            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (id === 'leftBtn') mobileButtons.left = true;
                if (id === 'rightBtn') mobileButtons.right = true;
                if (id === 'fireBtn') {
                    mobileButtons.fire = true;
                    shoot();
                }
            });

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (id === 'leftBtn') mobileButtons.left = false;
                if (id === 'rightBtn') mobileButtons.right = false;
                if (id === 'fireBtn') mobileButtons.fire = false;
            });
        });

        // Shooting
        function shoot() {
            if (!player.canShoot || game.state !== 'playing') return;

            if (player.spreadShot) {
                [-15, 0, 15].forEach(angle => {
                    player.bullets.push({
                        x: player.x + player.width / 2,
                        y: player.y,
                        angle: angle,
                        speed: 8,
                        width: 4,
                        height: 12
                    });
                });
            } else {
                player.bullets.push({
                    x: player.x + player.width / 2,
                    y: player.y,
                    angle: 0,
                    speed: 8,
                    width: 4,
                    height: 12
                });
            }

            sounds.shoot(440);
            player.canShoot = false;
            player.shootCooldown = player.rapidFire ? 5 : 15;
        }

        // Draw player ship
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);

            // Shield effect
            if (player.shield) {
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, player.width / 2 + 10, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Invulnerability flash
            if (player.invulnerable > 0 && Math.floor(player.invulnerable / 5) % 2 === 0) {
                ctx.restore();
                return;
            }

            // Ship body
            const gradient = ctx.createLinearGradient(0, -player.height / 2, 0, player.height / 2);
            gradient.addColorStop(0, '#00ffff');
            gradient.addColorStop(1, '#0080ff');
            ctx.fillStyle = gradient;

            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffff';

            // Main hull
            ctx.beginPath();
            ctx.moveTo(0, -player.height / 2);
            ctx.lineTo(player.width / 3, player.height / 2);
            ctx.lineTo(-player.width / 3, player.height / 2);
            ctx.closePath();
            ctx.fill();

            // Wings
            ctx.fillStyle = '#0080ff';
            ctx.fillRect(-player.width / 2, player.height / 4, player.width / 4, player.height / 4);
            ctx.fillRect(player.width / 4, player.height / 4, player.width / 4, player.height / 4);

            // Cockpit
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI * 2);
            ctx.fill();

            // Engine glow
            ctx.fillStyle = 'rgba(255, 100, 0, 0.8)';
            const engineGlow = Math.sin(game.frameCount * 0.3) * 5 + 10;
            ctx.fillRect(-5, player.height / 2, 10, engineGlow);

            ctx.restore();
        }

        // Game loop
        function update() {
            if (game.state !== 'playing') return;

            game.frameCount++;

            // Player movement
            if (keys['ArrowLeft'] || mobileButtons.left) {
                player.x = Math.max(0, player.x - player.speed);
            }
            if (keys['ArrowRight'] || mobileButtons.right) {
                player.x = Math.min(canvas.width - player.width, player.x + player.speed);
            }

            // Shooting cooldown
            if (player.shootCooldown > 0) {
                player.shootCooldown--;
                if (player.shootCooldown === 0) player.canShoot = true;
            }

            // Auto-fire for mobile
            if (mobileButtons.fire && player.canShoot) {
                shoot();
            }

            // Update powerup timer
            if (player.powerupTime > 0) {
                player.powerupTime--;
                if (player.powerupTime === 0) {
                    player.rapidFire = false;
                    player.shield = false;
                    player.spreadShot = false;
                    document.getElementById('powerupIndicator').classList.remove('active');
                }
            }

            // Update invulnerability
            if (player.invulnerable > 0) player.invulnerable--;

            // Update player bullets
            player.bullets = player.bullets.filter(bullet => {
                bullet.y -= bullet.speed;
                bullet.x += Math.sin(bullet.angle * Math.PI / 180) * bullet.speed * 0.5;
                return bullet.y > -bullet.height;
            });

            // Update enemy bullets
            enemyBullets.forEach(bullet => {
                bullet.y += bullet.speed;
            });
            enemyBullets.splice(0, enemyBullets.length, ...enemyBullets.filter(b => b.y < canvas.height));

            // Update enemies
            enemies.forEach(enemy => enemy.update());

            // Update powerups
            game.powerups.forEach(powerup => {
                powerup.y += powerup.speed;
                powerup.rotation += 0.1;
            });
            game.powerups = game.powerups.filter(p => p.y < canvas.height);

            // Update particles
            game.particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                p.size *= 0.95;
            });
            game.particles = game.particles.filter(p => p.life > 0);

            // Collision detection: player bullets vs enemies
            player.bullets.forEach((bullet, bIndex) => {
                enemies.forEach((enemy, eIndex) => {
                    if (bullet.x > enemy.x && bullet.x < enemy.x + enemy.width &&
                        bullet.y > enemy.y && bullet.y < enemy.y + enemy.height) {
                        player.bullets.splice(bIndex, 1);
                        if (enemy.hit()) {
                            enemies.splice(eIndex, 1);
                        }
                    }
                });
            });

            // Collision detection: enemy bullets vs player
            if (player.invulnerable === 0) {
                enemyBullets.forEach((bullet, index) => {
                    if (bullet.x > player.x && bullet.x < player.x + player.width &&
                        bullet.y > player.y && bullet.y < player.y + player.height) {
                        enemyBullets.splice(index, 1);
                        if (!player.shield) {
                            hitPlayer();
                        } else {
                            sounds.powerup();
                        }
                    }
                });
            }

            // Collision detection: enemies vs player
            if (player.invulnerable === 0) {
                enemies.forEach(enemy => {
                    if (player.x < enemy.x + enemy.width &&
                        player.x + player.width > enemy.x &&
                        player.y < enemy.y + enemy.height &&
                        player.y + player.height > enemy.y) {
                        if (!player.shield) {
                            hitPlayer();
                        }
                    }
                });
            }

            // Collision detection: powerups vs player
            game.powerups.forEach((powerup, index) => {
                if (powerup.x > player.x && powerup.x < player.x + player.width &&
                    powerup.y > player.y && powerup.y < player.y + player.height) {
                    collectPowerup(powerup.type);
                    game.powerups.splice(index, 1);
                }
            });

            // Check wave complete
            if (enemies.length === 0) {
                game.wave++;
                updateUI();
                setTimeout(spawnWave, 2000);
            }
        }

        function hitPlayer() {
            player.lives--;
            player.invulnerable = 120;
            sounds.explosion();
            createExplosion(player.x + player.width / 2, player.y + player.height / 2, 30);
            updateUI();

            if (player.lives <= 0) {
                gameOver();
            }
        }

        function collectPowerup(type) {
            sounds.powerup();
            player.powerupTime = 600; // 10 seconds at 60fps

            const indicator = document.getElementById('powerupIndicator');
            indicator.classList.add('active');

            switch(type) {
                case 'rapidFire':
                    player.rapidFire = true;
                    indicator.textContent = '⚡ Rapid Fire!';
                    break;
                case 'shield':
                    player.shield = true;
                    indicator.textContent = '🛡️ Shield Active!';
                    break;
                case 'spreadShot':
                    player.spreadShot = true;
                    indicator.textContent = '💫 Spread Shot!';
                    break;
            }
        }

        function draw() {
            // Clear canvas with trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars background
            if (game.frameCount % 3 === 0) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                for (let i = 0; i < 2; i++) {
                    ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
                }
            }

            // Draw particles
            game.particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.globalAlpha = 1;
            });

            // Draw powerups
            game.powerups.forEach(powerup => {
                ctx.save();
                ctx.translate(powerup.x, powerup.y);
                ctx.rotate(powerup.rotation);

                const colors = {
                    rapidFire: '#ffff00',
                    shield: '#00ffff',
                    spreadShot: '#ff00ff'
                };

                ctx.shadowBlur = 15;
                ctx.shadowColor = colors[powerup.type];
                ctx.fillStyle = colors[powerup.type];

                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
                    const radius = i % 2 === 0 ? powerup.size : powerup.size / 2;
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            });

            // Draw player bullets
            player.bullets.forEach(bullet => {
                const gradient = ctx.createLinearGradient(bullet.x, bullet.y, bullet.x, bullet.y - bullet.height);
                gradient.addColorStop(0, '#00ffff');
                gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
                ctx.fillStyle = gradient;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffff';
                ctx.fillRect(bullet.x - bullet.width / 2, bullet.y - bullet.height, bullet.width, bullet.height);
                ctx.shadowBlur = 0;
            });

            // Draw enemy bullets
            enemyBullets.forEach(bullet => {
                const gradient = ctx.createLinearGradient(bullet.x, bullet.y, bullet.x, bullet.y + bullet.height);
                gradient.addColorStop(0, '#ff00ff');
                gradient.addColorStop(1, 'rgba(255, 0, 255, 0)');
                ctx.fillStyle = gradient;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff00ff';
                ctx.fillRect(bullet.x - bullet.width / 2, bullet.y, bullet.width, bullet.height);
                ctx.shadowBlur = 0;
            });

            // Draw enemies
            enemies.forEach(enemy => enemy.draw());

            // Draw player
            drawPlayer();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            document.getElementById('score').textContent = game.score;
            document.getElementById('wave').textContent = game.wave;
            document.getElementById('highScore').textContent = game.highScore;

            const livesContainer = document.getElementById('lives');
            livesContainer.innerHTML = '';
            for (let i = 0; i < player.lives; i++) {
                const life = document.createElement('div');
                life.className = 'life-icon';
                livesContainer.appendChild(life);
            }
        }

        function startGame() {
            game.state = 'playing';
            game.score = 0;
            game.wave = 1;
            player.lives = 3;
            player.x = canvas.width / 2;
            player.bullets = [];
            player.invulnerable = 0;
            player.powerup = null;
            player.powerupTime = 0;
            player.rapidFire = false;
            player.shield = false;
            player.spreadShot = false;
            enemies.length = 0;
            enemyBullets.length = 0;
            game.particles.length = 0;
            game.powerups.length = 0;

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('powerupIndicator').classList.remove('active');

            updateUI();
            spawnWave();
        }

        function gameOver() {
            game.state = 'gameover';

            if (game.score > game.highScore) {
                game.highScore = game.score;
                localStorage.setItem('galaxianHighScore', game.highScore);
            }

            document.getElementById('finalScore').textContent = `Final Score: ${game.score}`;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        // Event listeners
        document.getElementById('startBtn').addEventListener('click', () => {
            audioContext.resume();
            startGame();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            startGame();
        });

        // Start game loop
        gameLoop();
    </script>
</body>
</html>
